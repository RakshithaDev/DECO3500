<!doctype html>
<html>
<head>
  <meta charset="utf-8">
  <title>Live Comments</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <style>
    body{font-family:system-ui,-apple-system,Segoe UI,Roboto;background:#0b0b0b;color:#fff;margin:0}
    header{position:sticky;top:0;background:#111;padding:12px 14px;font-weight:600}
    #wrap{padding:12px 14px}
    .item{background:#1a1a1a;border-radius:12px;padding:10px;margin:10px 0}
    .ts{opacity:.75;font-size:12px;margin-top:6px}
    .muted{opacity:.8}
  </style>
</head>
<body>
  <header>Live Comments <span id="scope" class="muted"></span></header>
  <div id="wrap">Loading…</div>

  <script>
    // 1) Your published CSV URL (replace with yours)
    const CSV_URL = "https://docs.google.com/spreadsheets/d/e/2PACX-1vTZldNAIjMt8TnYL6gUZKpnNoUVO4lOjvM6yrzi41qdhKvDbFTh0PreMtmuXdTfIFvmdN9UZSjrNapb/pub?gid=744008182&single=true&output=csv";

    // Optional: filter by artwork via ?art=art-001
    const params = new URLSearchParams(location.search);
    const ART = params.get("art"); // null if not provided
    if (ART) document.getElementById("scope").textContent = `( ${ART} )`;

    // 2) Minimal CSV parser (no library)
    function parseCSV(text) {
      // Handles simple CSV; if your comments include lots of quotes/newlines,
      // consider PapaParse. This works fine for typical short comments.
      const rows = [];
      let cur = '', row = [], inQ = false;
      for (let i=0;i<text.length;i++) {
        const c = text[i], n = text[i+1];
        if (c === '"' ) {
          if (inQ && n === '"') { cur += '"'; i++; } // escaped quote
          else inQ = !inQ;
        } else if (c === ',' && !inQ) { row.push(cur); cur=''; }
        else if ((c === '\n' || c === '\r') && !inQ) {
          if (cur.length || row.length) { row.push(cur); rows.push(row); }
          cur=''; row=[];
        } else { cur += c; }
      }
      if (cur.length || row.length) { row.push(cur); rows.push(row); }
      return rows;
    }

    function escapeHtml(s){return s.replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[m]));}

    async function load() {
      const wrap = document.getElementById("wrap");
      try {
        const res = await fetch(CSV_URL + "&_ts=" + Date.now()); // cache-bust
        const csv = await res.text();
        const rows = parseCSV(csv);
        if (!rows.length) { wrap.textContent = "No data."; return; }

        // Map header indices
        const header = rows[0];
        const iTs = header.findIndex(h => /timestamp/i.test(h));
        const iComment = header.findIndex(h => /comment/i.test(h));
        const iArt = header.findIndex(h => /art(work)?\s*id/i.test(h));

        // Convert rows → objects
        let items = rows.slice(1).map(r => ({
          ts: iTs >= 0 ? r[iTs] : "",
          text: iComment >= 0 ? r[iComment] : "",
          art: iArt >= 0 ? r[iArt] : ""
        }));

        // Filter by artwork if ?art= present
        if (ART && iArt >= 0) {
          items = items.filter(x => (x.art || "").trim() === ART);
        }

        // Show newest first
        items.reverse();

        wrap.innerHTML = items.length
          ? items.map(x => `
              <div class="item">
                ${escapeHtml(x.text || "")}
                <div class="ts">${escapeHtml(x.ts || "")}${x.art ? ` • ${escapeHtml(x.art)}` : ""}</div>
              </div>
            `).join("")
          : `<div class="muted">No comments yet.</div>`;
      } catch (e) {
        wrap.innerHTML = `<div class="muted">Could not load comments. Please try again.</div>`;
        console.error(e);
      }
    }

    load();
    // Refresh every 20s (tune as you like)
    setInterval(load, 20000);
  </script>
</body>
</html>
